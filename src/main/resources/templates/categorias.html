<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arán Shop - Categorías</title>

    <link rel="stylesheet" th:href="@{/css/Estilos.css}">
</head>
<body>

<header>
    <h1>Arán Shop</h1>
    <p>Administración de categorías</p>
</header>

<main class="contenedor">

    <section class="tarjeta">

        <h2 th:text="${categoriaEditar != null} ?
            'Editar categoría' : 'Registrar categoría'">
            Registrar categoría
        </h2>

        <div th:if="${exito}"
             th:text="${exito}"
             style="background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px;">
        </div>

        <div th:if="${error}"
             th:text="${error}"
             style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px;">
        </div>

        <form th:action="${categoriaEditar != null} ?
                  @{/categorias/actualizar} : @{/categorias/guardar}"
              method="post">

            <input type="hidden"
                   name="id"
                   th:if="${categoriaEditar != null}"
                   th:value="${categoriaEditar.id}">

            <label for="nombre">Nombre de la categoría</label>

            <input type="text"
                   id="nombre"
                   name="nombre"
                   placeholder="Digite el nombre de la categoría"
                   th:value="${categoriaEditar != null} ?
                       ${categoriaEditar.nombre} : ''"
                   required>

            <button type="submit"
                    th:text="${categoriaEditar != null} ?
                        'Actualizar categoría' : 'Guardar categoría'">
                Guardar categoría
            </button>

            <a th:if="${categoriaEditar != null}"
               th:href="@{/categorias}"
               style="margin-left: 10px;">
                Cancelar
            </a>

        </form>

    </section>

    <section class="tarjeta">

        <h2>Listado de categorías</h2>

        <table border="1"
               style="width:100%; border-collapse: collapse; text-align: left;">

            <thead>
            <tr style="background-color: #174a5b; color: white;">
                <th style="padding: 12px;">ID</th>
                <th style="padding: 12px;">Nombre</th>
                <th style="padding: 12px;">Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="cat : ${categorias}">

                <td style="padding: 10px;"
                    th:text="${cat.id}">1</td>

                <td style="padding: 10px;"
                    th:text="${cat.nombre}">Herramientas</td>

                <td style="padding: 10px;">

                    <a th:href="@{/categorias/editar/{id}(id=${cat.id})}">
                        <button type="button">Editar</button>
                    </a>

                    <form th:action="@{/categorias/eliminar/{id}(id=${cat.id})}"
                          method="post"
                          style="display: inline;"
                          onsubmit="return confirm('¿Está seguro de eliminar esta categoría?');">

                        <button type="submit">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3"
                    style="padding: 20px; text-align: center;">
                    No hay categorías registradas.
                </td>
            </tr>

            </tbody>

        </table>

    </section>

    <div style="margin-top: 20px;">
        <a th:href="@{/menu}">← Volver al menú</a>
    </div>

</main>

<footer>
    <p>&copy; 2026 Arán Shop - Proyecto Académico</p>
</footer>

</body>
</html>
